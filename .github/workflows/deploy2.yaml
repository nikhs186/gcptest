name: Deploy to LKE

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write   # required to push to GHCR with GITHUB_TOKEN

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lisi-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -t "${IMAGE}:${{ github.sha }}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${{ github.sha }}"
          docker push "${IMAGE}:latest"

      - name: Set up kubeconfig
        run: |
          if [ -z "$LKE_KUBECONFIG" ]; then
            echo "::error::LKE_KUBECONFIG secret is not set (or empty) in the repo settings"
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          echo "$LKE_KUBECONFIG" | base64 -d > "$HOME/.kube/config"
          if ! kubectl --kubeconfig "$HOME/.kube/config" cluster-info > /dev/null 2>&1; then
            echo "::error::Decoded kubeconfig is invalid or cluster is unreachable"
            exit 1
          fi
        env:
          LKE_KUBECONFIG: ${{ secrets.LKE_KUBECONFIG }}

      - name: Deploy manifests
        run: kubectl apply -f deployment.yaml

      - name: Roll out the new image
        run: |
          kubectl set image deployment/app app="${IMAGE}:${{ github.sha }}"
          kubectl rollout status deployment/app
