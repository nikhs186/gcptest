name: Deploy to GCP

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write   # required for keyless Workload Identity Federation auth

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/1009507091220/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@esoteric-fx-422410-a7.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker auth
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and push image
        run: |
          docker build -t asia-south1-docker.pkg.dev/esoteric-fx-422410-a7/gcp-test/app:${{ github.sha }} .
          docker push asia-south1-docker.pkg.dev/esoteric-fx-422410-a7/gcp-test/app:${{ github.sha }}

      - name: Create new instance template
        run: |
          gcloud compute instance-templates create-with-container instance-template-global-${{ github.sha }} \
            --source-instance-template=instance-template-global \
            --container-image=asia-south1-docker.pkg.dev/esoteric-fx-422410-a7/gcp-test/app:${{ github.sha }}

      - name: Roll out to MIG
        run: |
          gcloud compute instance-groups managed rolling-action start-update instance-group-1 \
            --version=template=instance-template-global-${{ github.sha }} \
            --region=asia-south1 \
            --max-surge=1 --max-unavailable=0

      - name: Wait for rollout to finish
        run: |
          gcloud compute instance-groups managed wait-until instance-group-1 \
            --version-target-reached \
            --region=asia-south1
