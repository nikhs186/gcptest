name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: lisi-lease-staging-f86ca
  REGION: asia-south1
  SERVICE: lisi-api
  REPOSITORY: lisi-api   # Artifact Registry Docker repo

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${{ github.sha }}" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --port 8080 \
            --cpu 4 \
            --memory 8Gi \
            --min-instances 2 \
            --max-instances 50 \
            --allow-unauthenticated
